---
downloads: ~/.ansible-downloads/

configure_dotfiles: true
configure_terminal: true
configure_osx: true

# Set to 'true' to configure the Dock via dockutil.
configure_dock: true
dockitems_remove: []
dockitems_persist: #[]
- name: "System Settings"
  path: "/Applications/System Settings.app/"
  pos: 1
- name: "Terminal"
  path: "/Applications/Utilities/Terminal.app/"
  pos: 3
- name: "Mail"
  path: "/Applications/Mail.app/"
  pos: 4
- name: "Microsoft Outlook"
  path: "/Applications/Microsoft Outlook.app/"
  pos: 5
- name: "Messages"
  path: "/Applications/Messages.app/"
  pos: 6
- name: "Mattermost"
  path: "/Applications/Mattermost.app/"
  pos: 7
- name: "Signal"
  path: "/Applications/Signal.app/"
  pos: 8
- name: "Telegram"
  path: "/Applications/Telegram.app/"
  pos: 9
- name: "Safari"
  path: "/Applications/Safari.app/"
  pos: 10
- name: "Firefox"
  path: "/Applications/Firefox.app/"
  pos: 11
- name: "Google Chrome"
  path: "/Applications/Google Chrome.app/"
  pos: 12
- name: "Enpass"
  path: "/Applications/Enpass.app/"
  pos: 13
- name: "ChatGPT"
  path: "/Applications/ChatGPT.app/"
  pos: 15
- name: "Claude"
  path: "/Applications/Claude.app/"
  pos: 16
- name: "Applications"
  path: "'/Applications --view list --display folder'"
  pos: 97
- name: "Downloads"
  path: "'~/Downloads --view list  --display folder'"
  pos: 98
- name: "Documents"
  path: "'~/Documents --view list  --display folder'"
  pos: 99

dock_spacers_after:
  - "System Settings"
  - "Enpass"
  - "Claude"


dotfiles_repo: https://github.com/royvandongen/dotfiles.git
dotfiles_repo_accept_hostkey: true
dotfiles_repo_local_destination: ~/Development/GitHub/dotfiles
dotfiles_files:
  - .zshrc
  - .gitignore
  - .osx
  - .vimrc

homebrew_installed_packages:
  - dockutil
  - mas
  - autoconf
  - bash-completion
  - doxygen
  - gettext
  - git
  - nmap
  - ssh-copy-id
  - openssl
  - wget
  - zsh-history-substring-search
  - ffmpeg
  - htop
  - btop
  - yt-dlp
  - iperf3
  - k9s
  - kubelogin
  - wireguard-tools
  - siderolabs/tap/talosctl

homebrew_taps:
  - siderolabs/tap

homebrew_cask_appdir: /Applications
homebrew_cask_apps:
  - audacity
  - balenaetcher
  - docker-desktop
  - dropbox
  - firefox
  - google-chrome
  - istat-menus
  - loopback
  - mattermost
  - microsoft-office
  - microsoft-teams
  - mqtt-explorer
  - nextcloud
  - obs
  - signal
  - spotify
  - sublime-text
  - telegram
  - visual-studio-code
  - vlc
  - wireshark
  - logi-options+
  - cleanmymac
  - chatgpt
  - claude
  - claude-code

mas_installed_apps:
  - { id: 1352778147, name: "Bitwarden" }
  - { id: 900392332, name: "DaVinci Resolve Studio" }
  - { id: 732710998, name: "Enpass" }
  - { id: 1451685025, name: "WireGuard" }
  - { id: 877615577, name: "Serial" }
  - { id: 1295203466, name: "Windows App" }

osx_script: "~/.osx --no-restart"
osx_scriptfile: "~/.osx"

# Set to 'true' to configure Sublime Text.
configure_sublime: true
sublime_base_path: '~/Library/Application Support/Sublime Text'
sublime_config_path: "Packages/User"
sublime_package_control:
  - "Jinja2"
  - "Pretty JSON"
  - "SublimeLinter"
  - "SublimeLinter-contrib-yamllint"
  - "Dockerfile Syntax Highlighting"


# Glob pattern to ansible task files to run after all other tasks are finished.
post_provision_tasks: []

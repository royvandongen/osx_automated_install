---
- name: Configure host.
  hosts: all

  environment:
    PATH: "/opt/homebrew/bin:/usr/local/bin:{{ ansible_env.PATH }}"

  vars_prompt:
    - name: ansible_become_password
      prompt: "macOS password (for sudo)"
      private: true

  vars_files:
    - default.config.yml

  pre_tasks:
    - name: Install New System | PreTask | Include playbook configuration.
      ansible.builtin.include_vars: "{{ item }}"
      loop: "{{ query('fileglob', playbook_dir + '/config.yml') }}"
      tags: ['always']
      
    - name: Install New System | PreTask | Check dotfiles clone for local changes
      ansible.builtin.command: git status --porcelain --untracked-files=no
      args:
        chdir: "{{ dotfiles_repo_local_destination }}"
      register: dotfiles_status
      changed_when: false
      failed_when: false
      tags: ['dotfiles']

    - name: Install New System | PreTask | Ask whether to overwrite local dotfiles changes
      ansible.builtin.pause:
        prompt: |
          Local changes in {{ dotfiles_repo_local_destination }}:
          {{ dotfiles_status.stdout }}
          Overwrite them with the version from GitHub? (yes/no)
      register: dotfiles_overwrite
      when: dotfiles_status.stdout | default('') | length > 0
      tags: ['dotfiles']

    - name: Install New System | PreTask | Discard local dotfiles changes
      ansible.builtin.command: git reset --hard
      args:
        chdir: "{{ dotfiles_repo_local_destination }}"
      when: (dotfiles_overwrite.user_input | default('') | lower) == 'yes'
      tags: ['dotfiles']
      
  roles:
    - role: elliotweiser.osx-command-line-tools
    - role: geerlingguy.mac.homebrew
      tags: ['homebrew']
    - role: geerlingguy.mac.mas
      when: mas_installed_apps | length > 0
      tags: ['mas']
    - role: geerlingguy.dotfiles
      when: configure_dotfiles
      tags: ['dotfiles']

  tasks:
    - name: Install New System | Dock | Install trusted third-party formulae
      ansible.builtin.import_tasks: tasks/homebrew-trusted.yml
      when: homebrew_trusted_formulae | default([]) | length > 0
      tags: ['homebrew']
  
    - name: Install New System | Dock | Reset Dock if it differs from config
      ansible.builtin.import_tasks: tasks/dock-reset.yml
      when: configure_dock
      tags: ['dock']

    - name: Install New System | Dock | Configure Dock
      ansible.builtin.import_role:
        name: geerlingguy.mac.dock
      when: configure_dock
      tags: ['dock']

    - name: Install New System | Dock Spacing | Add Dock spacers
      ansible.builtin.import_tasks: tasks/dock-spacers.yml
      when: configure_dock
      tags: ['dock']

    - name: Install New System | OSX Tasks | Configure macOS defaults
      ansible.builtin.import_tasks: tasks/osx.yml
      when: configure_osx
      tags: ['osx']

    - name: Install New System | Terminal Customization | Configure Terminal
      ansible.builtin.import_tasks: tasks/terminal.yml
      when: configure_terminal
      tags: ['terminal']

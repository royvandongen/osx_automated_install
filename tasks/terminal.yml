---
- name: Install New System | Terminal Modification | Get current default Terminal profile
  ansible.builtin.command: defaults read com.apple.Terminal "Default Window Settings"
  register: terminal_default
  changed_when: false
  failed_when: false
  become: false

- name: Install New System | Terminal Modification | Import Terminal profile
  ansible.builtin.command: open "{{ playbook_dir }}/files/terminal/{{ terminal_profile }}.terminal"
  when: terminal_default.stdout != terminal_profile
  become: false

- name: Install New System | Terminal Modification | Set profile as default and close import window
  ansible.builtin.command:
    cmd: osascript
    stdin: |
      tell application "Terminal"
        repeat with w in (every window)
          if name of current settings of selected tab of w is "{{ terminal_profile }}" then close w
        end repeat
        set default settings to settings set "{{ terminal_profile }}"
        set startup settings to settings set "{{ terminal_profile }}"
      end tell
  register: terminal_set
  retries: 5
  delay: 2
  until: terminal_set.rc == 0
  when: terminal_default.stdout != terminal_profile
  become: false

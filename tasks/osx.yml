---
# TODO: Use sudo once .osx can be run via root with no user interaction.
- name: Install New System | OSX Scripting | Set executable bit on osx script
  ansible.builtin.file:
    dest: "{{ osx_scriptfile }}"
    mode: a+x

- name: Install New System | OSX Scripting | Run .osx dotfiles.
  ansible.builtin.command: "{{ osx_script }}"
  changed_when: false

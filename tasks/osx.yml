---
# TODO: Use sudo once .osx can be run via root with no user interaction.
- name: Set executable bit on osx script
  become: false
  ansible.builtin.file:
    dest: "{{ osx_scriptfile }}"
    mode: a+x

- name: Run .osx dotfiles.
  become: false
  ansible.builtin.command: "{{ osx_script }}"
  changed_when: false

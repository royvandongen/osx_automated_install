---
- name: Install New System | Dock Spacing | Count small spacers in the Dock
  ansible.builtin.shell: defaults read com.apple.dock persistent-apps | grep -c small-spacer-tile || true
  register: dock_spacer_count
  changed_when: false

- name: Install New System | Dock Spacing | Remove existing spacers before re-adding
  ansible.builtin.command: >
    dockutil --remove spacer-tiles
    {{ '--no-restart' if dock_spacers_after | length > 0 else '' }}
  when: dock_spacer_count.stdout | int != dock_spacers_after | length

- name: Install New System | Dock Spacing | Add small spacer after {{ item }}
  ansible.builtin.command: >
    dockutil --add '' --type small-spacer --section apps
    --after '{{ item }}'
    {{ '' if ansible_loop.last else '--no-restart' }}
  loop: "{{ dock_spacers_after }}"
  loop_control:
    extended: true
  when: dock_spacer_count.stdout | int != dock_spacers_after | length
